spring:
  application:
    name: uscdip-backend
  datasource:
    url: jdbc:h2:mem:uscdip;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    show-sql: false
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

backend:
  oidc:
    enabled: ${BACKEND_OIDC_ENABLED:false}
    registration-id: ${OIDC_REGISTRATION_ID:keycloak}
    issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8081/realms/uscdip}
    client-id: ${OIDC_CLIENT_ID:uscdip-backend}
    client-secret: ${OIDC_CLIENT_SECRET:change-me}
    access-token-secret: ${LOCAL_ACCESS_TOKEN_SECRET:change-me-local-access-token-secret}
    access-token-ttl-seconds: ${LOCAL_ACCESS_TOKEN_TTL_SECONDS:1800}
    refresh-token-ttl-seconds: ${LOCAL_REFRESH_TOKEN_TTL_SECONDS:1209600}
    state-ttl-seconds: ${OIDC_STATE_TTL_SECONDS:300}
    refresh-token-hash-algorithm: ${REFRESH_TOKEN_HASH_ALGORITHM:SHA-256}
    local-token-issuer: ${LOCAL_TOKEN_ISSUER:uscdip-backend}
    post-logout-redirect-uri: ${OIDC_POST_LOGOUT_REDIRECT_URI:http://localhost:8080/swagger-ui/index.html}
    default-role: ${OIDC_DEFAULT_ROLE:LEADER_READONLY}
    default-region: ${OIDC_DEFAULT_REGION:REGION-HZ}
